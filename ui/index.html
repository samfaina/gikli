<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title></title>
    <link rel="stylesheet" href="./src/styles.css" />
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <header class="toolbar">
      <button id="open-folder" type="button" data-testid="open-folder"></button>
      <button id="new-repository" type="button" data-testid="new-repository"></button>
      <button id="toggle-clone" type="button" data-testid="toggle-clone" aria-expanded="false" aria-controls="clone"></button>
      <span id="git-status" class="git-status" data-testid="git-status"></span>
      <button id="toggle-operation-log" class="toolbar-end" type="button" data-testid="toggle-operation-log" aria-expanded="false" aria-controls="operation-log"></button>
      <button id="toggle-settings" type="button" data-testid="toggle-settings" aria-expanded="false" aria-controls="settings"></button>
    </header>
    <form id="clone" class="settings" data-testid="clone" hidden>
      <label id="clone-url-label" for="clone-url"></label>
      <div class="settings-row">
        <input id="clone-url" type="text" data-testid="clone-url" spellcheck="false" autocomplete="off" />
      </div>
      <fieldset class="settings-row url-forms">
        <legend id="clone-url-form-label"></legend>
        <label><input id="clone-url-https" type="radio" name="clone-url-form" data-testid="clone-url-https" disabled /><span id="clone-url-https-label"></span></label>
        <label><input id="clone-url-ssh" type="radio" name="clone-url-form" data-testid="clone-url-ssh" disabled /><span id="clone-url-ssh-label"></span></label>
      </fieldset>
      <label id="clone-folder-label" for="clone-folder"></label>
      <div class="settings-row">
        <input id="clone-folder" type="text" data-testid="clone-folder" spellcheck="false" autocomplete="off" />
        <button id="browse-clone-folder" type="button" data-testid="browse-clone-folder"></button>
      </div>
      <p id="clone-folder-hint" class="hint"></p>
      <div class="settings-row clone-actions">
        <button id="start-clone" type="submit" data-testid="start-clone" disabled></button>
      </div>
      <div id="clone-result" data-testid="clone-result" role="status"></div>
    </form>
    <section id="settings" class="settings" data-testid="settings" hidden>
      <label id="git-path-label" for="git-path"></label>
      <div class="settings-row">
        <input id="git-path" type="text" data-testid="git-path" spellcheck="false" autocomplete="off" />
        <button id="test-git" type="button" data-testid="test-git"></button>
        <button id="save-git-path" type="button" data-testid="save-git-path"></button>
      </div>
      <p id="git-path-hint" class="hint"></p>
      <p id="git-test-result" class="git-test-result" data-testid="git-test-result" role="status"></p>
      <label class="settings-check"><input id="use-credential-helper" type="checkbox" data-testid="use-credential-helper" /><span id="use-credential-helper-label"></span></label>
      <p id="use-credential-helper-hint" class="hint"></p>
      <label class="settings-check"><input id="clone-submodules-recursively" type="checkbox" data-testid="clone-submodules-recursively" /><span id="clone-submodules-recursively-label"></span></label>
      <label class="settings-check"><input id="diff-local-side-editable" type="checkbox" data-testid="diff-local-side-editable" /><span id="diff-local-side-editable-label"></span></label>
      <label class="settings-check"><input id="go-to-next-file-after-last-change" type="checkbox" data-testid="go-to-next-file-after-last-change" /><span id="go-to-next-file-after-last-change-label"></span></label>
      <label class="settings-check"><input id="warn-on-unusual-commit-state" type="checkbox" data-testid="warn-on-unusual-commit-state" /><span id="warn-on-unusual-commit-state-label"></span></label>
      <label class="settings-check"><input id="clear-commit-message-after-commit" type="checkbox" data-testid="clear-commit-message-after-commit" /><span id="clear-commit-message-after-commit-label"></span></label>
      <label class="settings-check"><input id="staging-mode" type="checkbox" data-testid="staging-mode" /><span id="staging-mode-label"></span></label>
      <p id="staging-mode-hint" class="hint"></p>
    </section>
    <section id="prompts" class="prompts" data-testid="prompts" hidden></section>
    <section id="notifications" class="notifications" data-testid="notifications" aria-live="polite" hidden></section>
    <main id="project" class="project" data-testid="project"></main>
    <section id="diff" class="diff" data-testid="diff" hidden>
      <div class="diff-toolbar">
        <h2 id="diff-title" class="diff-title" data-testid="diff-title"></h2>
        <button id="diff-previous-difference" type="button" data-testid="diff-previous-difference"></button>
        <button id="diff-next-difference" type="button" data-testid="diff-next-difference"></button>
        <button id="diff-previous-file" type="button" data-testid="diff-previous-file"></button>
        <button id="diff-next-file" type="button" data-testid="diff-next-file"></button>
        <button id="diff-save" type="button" data-testid="diff-save"></button>
        <button id="diff-close" type="button" data-testid="diff-close"></button>
      </div>
      <div id="diff-message" class="diff-message" data-testid="diff-message" role="status"></div>
      <div class="diff-sides">
        <span id="diff-head-label" data-testid="diff-head-label"></span>
        <span id="diff-local-label" data-testid="diff-local-label"></span>
      </div>
      <div id="diff-content" class="diff-content" data-testid="diff-content"></div>
    </section>
    <section id="log" class="log" data-testid="log" hidden>
      <div class="log-toolbar">
        <h2 id="log-title" class="log-title" data-testid="log-title"></h2>
        <button id="log-refresh" type="button" data-testid="log-refresh"></button>
        <button id="log-close" type="button" data-testid="log-close"></button>
      </div>
      <div id="log-message" class="log-message" data-testid="log-message" role="status"></div>
      <div id="log-list" class="log-list" data-testid="log-list" tabindex="0">
        <div id="log-rows" class="log-rows" data-testid="log-rows"></div>
      </div>
    </section>
    <section id="operation-log" class="operation-log" data-testid="operation-log" hidden>
      <div class="operation-log-header">
        <h2 id="operation-log-title"></h2>
        <label><input id="operation-log-soft-wrap" type="checkbox" data-testid="operation-log-soft-wrap" /><span id="operation-log-soft-wrap-label"></span></label>
        <button id="clear-operation-log" type="button" data-testid="clear-operation-log"></button>
      </div>
      <div id="operation-log-entries" class="operation-log-entries" data-testid="operation-log-entries" tabindex="0"></div>
    </section>
    <footer id="operations" class="operations" data-testid="operations" role="status" hidden></footer>
  </body>
</html>
