<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title></title>
    <link rel="stylesheet" href="./src/styles.css" />
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <div class="window-body">
      <header class="toolbar">
        <button id="open-folder" type="button" data-testid="open-folder"></button>
        <button id="new-repository" type="button" data-testid="new-repository"></button>
        <button id="toggle-clone" type="button" data-testid="toggle-clone" aria-expanded="false" aria-controls="clone"></button>
        <span id="git-status" class="git-status" data-testid="git-status"></span>
        <button id="toggle-operation-log" class="toolbar-end" type="button" data-testid="toggle-operation-log" aria-expanded="false" aria-controls="operation-log"></button>
        <button id="toggle-settings" type="button" data-testid="toggle-settings" aria-expanded="false" aria-controls="settings"></button>
      </header>
      <form id="clone" class="settings" data-testid="clone" hidden>
        <label id="clone-url-label" for="clone-url"></label>
        <div class="settings-row">
          <input id="clone-url" type="text" data-testid="clone-url" spellcheck="false" autocomplete="off" />
        </div>
        <fieldset class="settings-row url-forms">
          <legend id="clone-url-form-label"></legend>
          <label><input id="clone-url-https" type="radio" name="clone-url-form" data-testid="clone-url-https" disabled /><span id="clone-url-https-label"></span></label>
          <label><input id="clone-url-ssh" type="radio" name="clone-url-form" data-testid="clone-url-ssh" disabled /><span id="clone-url-ssh-label"></span></label>
        </fieldset>
        <label id="clone-folder-label" for="clone-folder"></label>
        <div class="settings-row">
          <input id="clone-folder" type="text" data-testid="clone-folder" spellcheck="false" autocomplete="off" />
          <button id="browse-clone-folder" type="button" data-testid="browse-clone-folder"></button>
        </div>
        <p id="clone-folder-hint" class="hint"></p>
        <div class="settings-row clone-actions">
          <button id="start-clone" type="submit" data-testid="start-clone" disabled></button>
        </div>
        <div id="clone-result" data-testid="clone-result" role="status"></div>
      </form>
      <section id="settings" class="settings" data-testid="settings" hidden>
        <label id="git-path-label" for="git-path"></label>
        <div class="settings-row">
          <input id="git-path" type="text" data-testid="git-path" spellcheck="false" autocomplete="off" />
          <button id="test-git" type="button" data-testid="test-git"></button>
          <button id="save-git-path" type="button" data-testid="save-git-path"></button>
        </div>
        <p id="git-path-hint" class="hint"></p>
        <p id="git-test-result" class="git-test-result" data-testid="git-test-result" role="status"></p>
        <label class="settings-check"><input id="use-credential-helper" type="checkbox" data-testid="use-credential-helper" /><span id="use-credential-helper-label"></span></label>
        <p id="use-credential-helper-hint" class="hint"></p>
        <label class="settings-check"><input id="clone-submodules-recursively" type="checkbox" data-testid="clone-submodules-recursively" /><span id="clone-submodules-recursively-label"></span></label>
        <label class="settings-check"><input id="diff-local-side-editable" type="checkbox" data-testid="diff-local-side-editable" /><span id="diff-local-side-editable-label"></span></label>
        <label class="settings-check"><input id="go-to-next-file-after-last-change" type="checkbox" data-testid="go-to-next-file-after-last-change" /><span id="go-to-next-file-after-last-change-label"></span></label>
        <label class="settings-check"><input id="warn-on-unusual-commit-state" type="checkbox" data-testid="warn-on-unusual-commit-state" /><span id="warn-on-unusual-commit-state-label"></span></label>
        <label class="settings-check"><input id="clear-commit-message-after-commit" type="checkbox" data-testid="clear-commit-message-after-commit" /><span id="clear-commit-message-after-commit-label"></span></label>
        <label class="settings-check"><input id="show-push-dialog-for-commit-and-push" type="checkbox" data-testid="show-push-dialog-for-commit-and-push" /><span id="show-push-dialog-for-commit-and-push-label"></span></label>
        <label class="settings-check"><input id="show-push-dialog-only-for-protected-branches" type="checkbox" data-testid="show-push-dialog-only-for-protected-branches" /><span id="show-push-dialog-only-for-protected-branches-label"></span></label>
        <label class="settings-check"><input id="staging-mode" type="checkbox" data-testid="staging-mode" /><span id="staging-mode-label"></span></label>
        <p id="staging-mode-hint" class="hint"></p>
      </section>
      <section id="prompts" class="prompts" data-testid="prompts" hidden></section>
      <section id="notifications" class="notifications" data-testid="notifications" aria-live="polite" hidden></section>
      <main id="project" class="project" data-testid="project"></main>
      <section id="diff" class="diff" data-testid="diff" hidden>
        <div class="diff-toolbar">
          <h2 id="diff-title" class="diff-title" data-testid="diff-title"></h2>
          <button id="diff-previous-difference" type="button" data-testid="diff-previous-difference"></button>
          <button id="diff-next-difference" type="button" data-testid="diff-next-difference"></button>
          <button id="diff-previous-file" type="button" data-testid="diff-previous-file"></button>
          <button id="diff-next-file" type="button" data-testid="diff-next-file"></button>
          <button id="diff-save" type="button" data-testid="diff-save"></button>
          <button id="diff-close" type="button" data-testid="diff-close"></button>
        </div>
        <div id="diff-message" class="diff-message" data-testid="diff-message" role="status"></div>
        <div class="diff-sides">
          <span id="diff-head-label" data-testid="diff-head-label"></span>
          <span id="diff-local-label" data-testid="diff-local-label"></span>
        </div>
        <div id="diff-content" class="diff-content" data-testid="diff-content"></div>
      </section>
      <section id="log" class="log" data-testid="log" hidden>
        <div class="log-toolbar">
          <h2 id="log-title" class="log-title" data-testid="log-title"></h2>
          <label><input id="log-long-edges" type="checkbox" data-testid="log-long-edges" /><span id="log-long-edges-label"></span></label>
          <button id="log-fetch" type="button" data-testid="log-fetch"></button>
          <button id="log-refresh" type="button" data-testid="log-refresh"></button>
          <button id="log-close" type="button" data-testid="log-close"></button>
        </div>
        <div class="log-filters">
          <input id="log-search" class="log-search" type="search" data-testid="log-search" />
          <select id="log-search-history" class="log-search-history" data-testid="log-search-history"></select>
          <label><input id="log-search-regex" type="checkbox" data-testid="log-search-regex" /><span id="log-search-regex-label"></span></label>
          <label><input id="log-search-match-case" type="checkbox" data-testid="log-search-match-case" /><span id="log-search-match-case-label"></span></label>
          <input id="log-go-to" class="log-go-to" type="text" list="log-go-to-suggestions" autocomplete="off" data-testid="log-go-to" />
          <datalist id="log-go-to-suggestions"></datalist>
        </div>
        <div id="log-message" class="log-message" data-testid="log-message" role="status"></div>
        <div id="log-history-cut" class="log-history-cut" data-testid="log-history-cut" hidden>
          <span id="log-history-cut-text"></span>
          <button id="log-fetch-rest" type="button" data-testid="log-fetch-rest"></button>
        </div>
        <div class="log-body">
          <aside class="log-branches" data-testid="log-branches">
            <div class="log-pane-header">
              <h3 id="log-branches-title"></h3>
              <button id="log-new-branch" type="button" data-testid="log-new-branch"></button>
              <button id="log-go-to-branch" type="button" data-testid="log-go-to-branch"></button>
            </div>
            <div id="log-branches-list" class="log-branches-list" data-testid="log-branches-list"></div>
          </aside>
          <div id="log-list" class="log-list" data-testid="log-list" tabindex="0">
            <div id="log-rows" class="log-rows" data-testid="log-rows"></div>
          </div>
          <aside class="log-side">
            <section class="log-changes" data-testid="log-changes">
              <div class="log-pane-header">
                <h3 id="log-changes-title"></h3>
                <button id="log-changes-grouping" type="button" data-testid="log-changes-grouping"></button>
              </div>
              <div id="log-changes-content" class="log-changes-content" data-testid="log-changes-content"></div>
            </section>
            <section id="log-details" class="log-details" data-testid="log-details"></section>
          </aside>
        </div>
      </section>
      <section id="file-history" class="file-history" data-testid="file-history" hidden>
        <div class="log-toolbar">
          <h2 id="file-history-title" class="log-title" data-testid="file-history-title"></h2>
          <label><span id="file-history-branch-label"></span><select id="file-history-branch" data-testid="file-history-branch"></select></label>
          <label><span id="file-history-limit-label"></span><input id="file-history-limit" class="file-history-limit" type="number" min="1" step="1" data-testid="file-history-limit" /></label>
          <button id="file-history-refresh" type="button" data-testid="file-history-refresh"></button>
          <button id="file-history-close" type="button" data-testid="file-history-close"></button>
        </div>
        <div id="file-history-message" class="log-message" data-testid="file-history-message" role="status"></div>
        <div class="file-history-body">
          <div id="file-history-list" class="file-history-list" data-testid="file-history-list" role="listbox" tabindex="0"></div>
          <aside class="file-history-side">
            <div class="log-pane-header">
              <h3 id="file-history-preview-title"></h3>
              <button id="file-history-get" type="button" data-testid="file-history-get" disabled></button>
            </div>
            <div id="file-history-preview" class="file-history-preview diff-content" data-testid="file-history-preview"></div>
            <div class="log-pane-header">
              <h3 id="file-history-files-title"></h3>
            </div>
            <div id="file-history-files" class="log-changes-content" data-testid="file-history-files"></div>
          </aside>
        </div>
      </section>
      <section id="push-dialog" class="push-dialog" data-testid="push-dialog" hidden>
        <div class="log-toolbar">
          <h2 id="push-title" class="log-title"></h2>
          <button id="push-close" type="button" data-testid="push-close"></button>
        </div>
        <ul class="push-tree" data-testid="push-tree">
          <li>
            <span id="push-repository" class="push-repository" data-testid="push-repository"></span>
            <ul>
              <li>
                <span id="push-branch" class="push-branch" data-testid="push-branch"></span>
                <span class="push-arrow" aria-hidden="true">→</span>
                <span id="push-target" class="push-target" data-testid="push-target">
                  <select id="push-remote" data-testid="push-remote"></select>
                  <span aria-hidden="true">/</span>
                  <input id="push-target-branch" type="text" spellcheck="false" data-testid="push-target-branch" />
                  <span id="push-new-branch" class="push-new-branch" data-testid="push-new-branch" hidden></span>
                </span>
                <span id="push-define-remote" class="push-define-remote" data-testid="push-define-remote" hidden>
                  <span id="push-define-text"></span>
                  <label><span id="push-define-name-label"></span><input id="push-define-name" type="text" spellcheck="false" data-testid="push-define-name" /></label>
                  <label><span id="push-define-url-label"></span><input id="push-define-url" class="push-define-url" type="text" spellcheck="false" data-testid="push-define-url" /></label>
                  <button id="push-define" type="button" data-testid="push-define"></button>
                </span>
              </li>
            </ul>
          </li>
        </ul>
        <div id="push-message" class="log-message" data-testid="push-message" role="status"></div>
        <div class="file-history-body">
          <div id="push-commits" class="file-history-list" data-testid="push-commits" role="listbox" tabindex="0"></div>
          <aside class="file-history-side">
            <div class="log-pane-header">
              <h3 id="push-files-title"></h3>
            </div>
            <div id="push-files" class="log-changes-content push-files" data-testid="push-files"></div>
            <div class="log-pane-header">
              <h3 id="push-preview-title"></h3>
            </div>
            <div id="push-preview" class="file-history-preview diff-content" data-testid="push-preview"></div>
          </aside>
        </div>
        <div class="push-footer">
          <label><input id="push-tags" type="checkbox" data-testid="push-tags" /><span id="push-tags-label"></span></label>
          <select id="push-tags-choice" data-testid="push-tags-choice" disabled></select>
          <span class="push-footer-gap"></span>
          <button id="push-start" type="button" data-testid="push-start" disabled></button>
          <button id="push-cancel" type="button" data-testid="push-cancel"></button>
        </div>
      </section>
      <section id="operation-log" class="operation-log" data-testid="operation-log" hidden>
        <div class="operation-log-header">
          <h2 id="operation-log-title"></h2>
          <label><input id="operation-log-soft-wrap" type="checkbox" data-testid="operation-log-soft-wrap" /><span id="operation-log-soft-wrap-label"></span></label>
          <button id="clear-operation-log" type="button" data-testid="clear-operation-log"></button>
        </div>
        <div id="operation-log-entries" class="operation-log-entries" data-testid="operation-log-entries" tabindex="0"></div>
      </section>
    </div>
    <footer class="window-foot">
      <section id="new-branch" class="branch-selector new-branch" data-testid="new-branch" role="dialog" aria-labelledby="new-branch-title" hidden>
        <div class="branch-selector-header">
          <h2 id="new-branch-title"></h2>
          <button id="new-branch-cancel" type="button" data-testid="new-branch-cancel"></button>
        </div>
        <label class="new-branch-name"><span id="new-branch-name-label"></span><input id="new-branch-name" type="text" list="new-branch-prefixes" autocomplete="off" spellcheck="false" data-testid="new-branch-name" /></label>
        <datalist id="new-branch-prefixes" data-testid="new-branch-prefixes"></datalist>
        <div class="new-branch-actions">
          <label><input id="new-branch-check-out" type="checkbox" data-testid="new-branch-check-out" /><span id="new-branch-check-out-label"></span></label>
          <button id="new-branch-create" type="button" data-testid="new-branch-create"></button>
        </div>
        <div id="new-branch-message" class="new-branch-message" data-testid="new-branch-message" role="status"></div>
      </section>
      <section id="branch-selector" class="branch-selector" data-testid="branch-selector" role="dialog" aria-labelledby="branch-selector-title" hidden>
        <div class="branch-selector-header">
          <h2 id="branch-selector-title"></h2>
          <button id="branch-selector-new-branch" type="button" data-testid="branch-selector-new-branch"></button>
          <button id="branch-selector-close" type="button" data-testid="branch-selector-close"></button>
        </div>
        <div id="branch-selector-current" class="branch-selector-current" data-testid="branch-selector-current"></div>
        <input id="branch-selector-search" class="branch-selector-search" type="search" autocomplete="off" spellcheck="false" data-testid="branch-selector-search" />
        <div class="branch-selector-options">
          <label><input id="branch-selector-show-recent" type="checkbox" data-testid="branch-selector-show-recent" /><span id="branch-selector-show-recent-label"></span></label>
          <label><input id="branch-selector-show-tags" type="checkbox" data-testid="branch-selector-show-tags" /><span id="branch-selector-show-tags-label"></span></label>
          <label><input id="branch-selector-group-by-directory" type="checkbox" data-testid="branch-selector-group-by-directory" /><span id="branch-selector-group-by-directory-label"></span></label>
        </div>
        <div id="branch-selector-groups" class="branch-selector-groups" data-testid="branch-selector-groups"></div>
      </section>
      <div id="operations" class="operations" data-testid="operations" role="status" hidden></div>
      <div id="status-area" class="status-area" data-testid="status-area" role="status" hidden></div>
    </footer>
  </body>
</html>
