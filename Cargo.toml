[workspace]
resolver = "3"
members = ["crates/gikli-core", "crates/gikli-acceptance", "src-tauri"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
gikli-core = { path = "crates/gikli-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1"
getrandom = "0.4"
notify = "8"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tempfile = "3"
