# Builds the image both Linux CI jobs run in (.github/ci-image/Dockerfile, ADR 0008) and publishes
# it to GHCR as ghcr.io/<owner>/gikli-ci:latest, and under the tag that names its definition (see
# .github/scripts/ci-image-tag.sh).
#
# It runs weekly, for the latest stable git and Ubuntu's updates, and by hand (`gh workflow run
# ci-image.yml`). The CI workflow also calls it on a push to main when the image of that push's
# definition does not exist yet: on the push that changes the definition or MINIMUM_GIT_VERSION,
# and on the first push that runs the Linux jobs in the image.
#
# The image is pushed only once it is built, so a build that fails leaves the previous :latest in
# place, and the Linux jobs keep running in it.
name: CI image

on:
  schedule:
    # Mondays at 04:17 UTC.
    - cron: "17 4 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish the CI image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Two builds at once would race to publish :latest.
    concurrency:
      group: ci-image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Name the image
        id: image
        run: |
          version=$(.github/scripts/minimum-git-version.sh)
          tag=$(.github/scripts/ci-image-tag.sh)
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gikli-ci"
          echo "minimum-git=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$name:latest,$name:$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .github/ci-image
          build-args: MINIMUM_GIT_VERSION=${{ steps.image.outputs.minimum-git }}
          # Ties the package to this repository, so the CI workflow's token can pull it.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ steps.image.outputs.tags }}
          push: true
          # Every weekly build fetches the latest stable git and Ubuntu's updates afresh.
          no-cache: true
