# Builds gikli and runs its suite on Windows, macOS and Linux. On Windows the suite runs twice: once
# against the runner's preinstalled git and once against the oldest git gikli supports. On Linux it
# also runs twice: once against the latest stable git and once against that oldest git.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            git: preinstalled
          - name: Windows (minimum git)
            os: windows-latest
            git: minimum
          - name: macOS
            os: macos-latest
            git: preinstalled
          # Pinned: the Tauri prerequisites below use Ubuntu 24.04 package names, and 26.04
          # renamed webkit2gtk-driver to webkitgtk-webdriver.
          - name: Linux (latest git)
            os: ubuntu-24.04
            git: latest
          - name: Linux (minimum git)
            os: ubuntu-24.04
            git: minimum
    steps:
      - uses: actions/checkout@v4

      - name: Install the Tauri prerequisites and the smoke test's WebDriver
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev webkit2gtk-driver xvfb

      - name: Install the latest stable git
        if: matrix.git == 'latest'
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install -y git
          # The package version, such as 1:2.51.1-0ppa1~ubuntu24.04.1, without epoch and revision.
          version=$(dpkg-query -W -f='${Version}' git | sed -E 's/^[0-9]+://; s/-.*//')
          # Checked by the_suite_runs_against_the_git_ci_asked_for.
          echo "GIKLI_EXPECTED_GIT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Read the minimum git version
        if: matrix.git == 'minimum'
        id: minimum-git
        shell: bash
        run: |
          version=$(sed -nE 's/.*MINIMUM_GIT_VERSION: GitVersion = GitVersion::new\(([0-9]+), ([0-9]+), ([0-9]+)\);.*/\1.\2.\3/p' \
            crates/gikli-core/src/lib.rs)
          test -n "$version" || { echo "::error::MINIMUM_GIT_VERSION not found in crates/gikli-core/src/lib.rs"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prefix=$HOME/git-$version" >> "$GITHUB_OUTPUT"

      - name: Restore git ${{ steps.minimum-git.outputs.version }}
        if: runner.os == 'Linux' && matrix.git == 'minimum'
        id: minimum-git-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.minimum-git.outputs.prefix }}
          # The workflow's hash covers the build options below.
          key: git-${{ steps.minimum-git.outputs.version }}-${{ matrix.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Build git ${{ steps.minimum-git.outputs.version }} from source
        if: runner.os == 'Linux' && matrix.git == 'minimum' && steps.minimum-git-cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.minimum-git.outputs.version }}
          PREFIX: ${{ steps.minimum-git.outputs.prefix }}
        run: |
          sudo apt-get install -y zlib1g-dev libcurl4-openssl-dev
          curl -fsSL "https://mirrors.edge.kernel.org/pub/software/scm/git/git-$VERSION.tar.gz" | tar -xz
          # Only what the tests use: remotes are local folders and a local HTTP server, and no
          # translations. This git predates C23, which newer compilers default to.
          options=(prefix="$PREFIX" CFLAGS="-O2 -std=gnu17" NO_EXPAT=1 NO_OPENSSL=1
            NO_GETTEXT=1 NO_TCLTK=1 NO_PERL=1 NO_PYTHON=1)
          make -C "git-$VERSION" -j"$(nproc)" "${options[@]}" all
          make -C "git-$VERSION" "${options[@]}" install
          rm -rf "git-$VERSION"

      - name: Put git ${{ steps.minimum-git.outputs.version }} first on the PATH
        if: runner.os == 'Linux' && matrix.git == 'minimum'
        run: |
          echo "${{ steps.minimum-git.outputs.prefix }}/bin" >> "$GITHUB_PATH"
          # Checked by the_suite_runs_against_the_git_ci_asked_for.
          echo "GIKLI_EXPECTED_GIT_VERSION=${{ steps.minimum-git.outputs.version }}" >> "$GITHUB_ENV"

      # PortableGit, because the suite needs git http-backend, ssh-keygen and sh. A download is
      # cheap enough to need no cache.
      - name: Install git ${{ steps.minimum-git.outputs.version }} and put it first on the PATH
        if: runner.os == 'Windows' && matrix.git == 'minimum'
        shell: bash
        env:
          VERSION: ${{ steps.minimum-git.outputs.version }}
        run: |
          folder=$(cygpath -m "$RUNNER_TEMP/git-$VERSION")
          mkdir -p "$folder"
          installer="PortableGit-$VERSION-64-bit.7z.exe"
          curl -fsSL --retry 3 -o "$folder/$installer" \
            "https://github.com/git-for-windows/git/releases/download/v$VERSION.windows.1/$installer"
          "$folder/$installer" -y -gm2 -o"$folder"
          # The installer can ignore -o and extract to a PortableGit folder beside itself.
          executable=$(find "$folder" -path '*/cmd/git.exe' -print -quit)
          test -n "$executable" || { echo "::error::cmd/git.exe not found in $folder"; exit 1; }
          cygpath -w "$(dirname "$executable")" >> "$GITHUB_PATH"
          # Checked by the_suite_runs_against_the_git_ci_asked_for.
          echo "GIKLI_EXPECTED_GIT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Show the git under test
        run: git --version

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.git }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the app
        run: npx tauri build --debug --no-bundle

      - name: Core tests
        run: cargo test --workspace

      - name: Typecheck the UI
        run: npm run typecheck

      - name: Test the smoke test's helpers
        run: npm run test:e2e-helpers

      - name: Install tauri-driver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --locked

      # On this runner WebView2 ignores the WEBVIEW2_* variables, so tauri-driver cannot start a
      # session (issue #54). This policy opens a fixed DevTools port in gikli's WebView2 instead,
      # and the variable makes the smoke test attach to it. Nothing but this step writes the policy:
      # it is machine-wide and would leave the port open on a developer's machine.
      - name: Open a DevTools port in gikli's WebView2 for the smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PORT: 9222
        run: |
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name 'gikli.exe' -Value "--remote-debugging-port=$env:PORT" -PropertyType String -Force | Out-Null
          "GIKLI_E2E_WEBVIEW2_DEBUG_PORT=$env:PORT" >> $env:GITHUB_ENV

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e

      # Not in bash: Git for Windows' bash puts its own git first on the PATH, so the minimum git
      # job would test the app against the runner's preinstalled git without saying so.
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e

      - name: Smoke test (skipped)
        if: runner.os == 'macOS'
        shell: bash
        env:
          REASON: tauri-driver does not support macOS
        run: |
          message="The end-to-end smoke test did not run on this job: $REASON."
          echo "::warning title=Smoke test skipped::$message"
          echo "**Smoke test skipped:** $message" >> "$GITHUB_STEP_SUMMARY"
