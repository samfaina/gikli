# Builds gikli and runs its suite on Windows, macOS and Linux, and once more on Linux against the
# oldest git gikli supports (MINIMUM_GIT_VERSION in crates/gikli-core/src/lib.rs).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The oldest supported git, built from source for the minimum-git job.
  MINIMUM_GIT: "2.34.1"

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            git: preinstalled
          - name: macOS
            os: macos-latest
            git: preinstalled
          - name: Linux (latest git)
            os: ubuntu-latest
            git: latest
          - name: Linux (git 2.34)
            os: ubuntu-latest
            git: minimum
    steps:
      - uses: actions/checkout@v4

      - name: Install the Tauri prerequisites and the smoke test's WebDriver
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev webkit2gtk-driver xvfb

      - name: Install the latest stable git
        if: matrix.git == 'latest'
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install -y git

      - name: Restore git ${{ env.MINIMUM_GIT }}
        if: matrix.git == 'minimum'
        id: minimum-git
        uses: actions/cache@v4
        with:
          path: /opt/git-${{ env.MINIMUM_GIT }}
          key: git-${{ env.MINIMUM_GIT }}-${{ matrix.os }}

      - name: Build git ${{ env.MINIMUM_GIT }} from source
        if: matrix.git == 'minimum' && steps.minimum-git.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y zlib1g-dev
          curl -fsSL "https://mirrors.edge.kernel.org/pub/software/scm/git/git-$MINIMUM_GIT.tar.gz" | tar -xz
          # Only what the tests use: remotes are local folders, so no HTTP, and no translations.
          # git 2.34 predates C23, which newer compilers default to.
          options=(prefix="/opt/git-$MINIMUM_GIT" CFLAGS="-O2 -std=gnu17" NO_CURL=1 NO_EXPAT=1
            NO_OPENSSL=1 NO_GETTEXT=1 NO_TCLTK=1 NO_PERL=1 NO_PYTHON=1)
          make -C "git-$MINIMUM_GIT" -j"$(nproc)" "${options[@]}" all
          sudo make -C "git-$MINIMUM_GIT" "${options[@]}" install
          rm -rf "git-$MINIMUM_GIT"

      - name: Put git ${{ env.MINIMUM_GIT }} first on the PATH
        if: matrix.git == 'minimum'
        run: |
          echo "/opt/git-$MINIMUM_GIT/bin" >> "$GITHUB_PATH"
          # Checked by the_suite_runs_against_the_git_ci_asked_for.
          echo "GIKLI_EXPECTED_GIT_VERSION=$MINIMUM_GIT" >> "$GITHUB_ENV"

      - name: Show the git under test
        run: git --version

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.git }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the app
        run: npx tauri build --debug --no-bundle

      - name: Core tests
        run: cargo test --workspace

      - name: Typecheck the UI
        run: npm run typecheck

      - name: Install tauri-driver
        if: runner.os != 'macOS'
        run: cargo install tauri-driver --locked

      - name: Smoke test
        if: runner.os == 'Windows'
        run: npm run test:e2e

      - name: Smoke test
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: Smoke test (skipped)
        if: runner.os == 'macOS'
        run: |
          message="tauri-driver does not support macOS, so the end-to-end smoke test did not run on this job."
          echo "::warning title=Smoke test skipped::$message"
          echo "**Smoke test skipped:** $message" >> "$GITHUB_STEP_SUMMARY"
