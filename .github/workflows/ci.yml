# Builds gikli and runs its suite on every push to main: the full matrix of CI's two tiers
# (ADR-0008; a pull request runs only the PR gate, pr.yml). It runs on Windows, macOS and Linux,
# and on Windows once more against the oldest git gikli supports. On Linux it runs twice: once
# against the latest stable git and once against that oldest git. The Linux jobs run in the CI
# image (.github/ci-image/Dockerfile), which holds both gits, the Tauri prerequisites and the smoke
# test's WebDriver, so they reach none of Ubuntu's package servers, Launchpad or kernel.org.
#
# Run by hand (workflow_dispatch), on any branch, it runs the same jobs and measures how often the
# smoke test fails on Linux and on Windows (issues #152 and #155): each Linux and Windows job runs
# the smoke test the number of times asked for, in a row, and says how many of those runs failed.
# macOS, which skips the smoke test, runs as on a push.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      smoke-runs:
        description: How many times in a row each Linux and Windows job runs the smoke test (about 3 minutes a run)
        type: number
        default: 20

concurrency:
  # A run by hand is a measurement: neither a push nor another run by hand cancels it.
  group: ci-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-and-macos:
    name: Windows and macOS
    uses: ./.github/workflows/windows-and-macos.yml
    with:
      matrix: >-
        [
          {"name": "Windows", "os": "windows-latest", "git": "preinstalled"},
          {"name": "Windows (minimum git)", "os": "windows-latest", "git": "minimum"},
          {"name": "macOS", "os": "macos-latest", "git": "preinstalled"}
        ]
      # A run by hand hands its number over as text, which the input, a number, does not take.
      smoke-runs: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.smoke-runs || '1') }}

  # On main, makes sure the CI image of this push's definition exists before the Linux jobs run in
  # it: it does not on the push that changes the image's definition or MINIMUM_GIT_VERSION, nor on
  # the first push that runs the Linux jobs in the image.
  look-for-ci-image:
    name: Look for the CI image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      missing: ${{ steps.look.outputs.missing }}
    steps:
      - uses: actions/checkout@v7

      - name: Look for the image of this definition
        id: look
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gikli-ci:$(.github/scripts/ci-image-tag.sh)"
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$TOKEN"
          # Any failure, such as a package that does not exist yet, means: build it.
          if docker manifest inspect "$image" > /dev/null; then
            echo "$image exists."
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "$image does not exist yet: building it."
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

  build-ci-image:
    name: Build the CI image
    needs: look-for-ci-image
    if: needs.look-for-ci-image.outputs.missing == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-image.yml

  # The checks of windows-and-macos.yml, in the CI image. Keep the two in step.
  linux:
    name: ${{ matrix.name }}
    # The image jobs above never stop these jobs: when the build fails, or is skipped on a branch
    # other than main, they run in the previous :latest.
    needs: [look-for-ci-image, build-ci-image]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    # Pulls the CI image, which GHCR may hold as a private package.
    permissions:
      contents: read
      packages: read
    container:
      # The name the image jobs give it, lowercased there as GHCR needs; gikli's owner already is.
      image: ghcr.io/${{ github.repository_owner }}/gikli-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Docker's default 64 MB of shared memory is little for WebKitGTK.
      options: --shm-size=1g
    # Well above the slowest job's usual 8 minutes, so a step that hangs stops its job long before
    # GitHub's 6-hour default. A run by hand repeats the smoke test, and gets the most a job can.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 360 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (latest git)
            git: latest
          - name: Linux (minimum git)
            git: minimum
    steps:
      - uses: actions/checkout@v7

      # The image's build checks this too, but :latest may predate that check or come from a
      # build by hand: never test Ubuntu's git in the PPA's place.
      - name: Check that the git under test is the latest stable git
        if: matrix.git == 'latest'
        run: |
          version=$(.github/scripts/ppa-git-version.sh "$(dpkg-query -W -f='${Version}' git 2>/dev/null)")
          # Checked by the_suite_runs_against_the_git_ci_asked_for.
          echo "GIKLI_EXPECTED_GIT_VERSION=$version" >> "$GITHUB_ENV"

      # The CI image builds it from source into /opt, off the PATH.
      - name: Put the minimum git first on the PATH
        if: matrix.git == 'minimum'
        run: |
          version=$(.github/scripts/minimum-git-version.sh)
          folder="/opt/git-$version/bin"
          test -x "$folder/git" || {
            echo "::error::The CI image holds no git $version in $folder. Run the CI image workflow (gh workflow run ci-image.yml), then this job again."
            exit 1
          }
          echo "$folder" >> "$GITHUB_PATH"
          # Checked by the_suite_runs_against_the_git_ci_asked_for.
          echo "GIKLI_EXPECTED_GIT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Show the git under test
        run: git --version

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ matrix.git }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the app
        run: npx tauri build --debug --no-bundle

      - name: Core tests
        run: cargo test --workspace

      - name: Typecheck the UI
        run: npm run typecheck

      - name: Test the smoke test's helpers
        run: npm run test:e2e-helpers

      # Each run writes its WebDriver logs, and a screenshot of each case that failed, to a folder
      # of its own (see e2e/failure-output.js), which the step after the smoke test keeps. The
      # folder is in the workspace: in a container, the runner context names the runner's own
      # folders, not the container's.
      - name: Smoke test (Linux)
        id: smoke-linux
        env:
          RUNS: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke-runs || 1 }}
          JOB: ${{ matrix.name }}
        run: |
          [[ "$RUNS" =~ ^[1-9][0-9]*$ ]] || { echo "::error::smoke-runs is $RUNS, not a whole number of at least 1"; exit 1; }
          failed=()
          for run in $(seq 1 "$RUNS"); do
            echo "::group::Smoke test, run $run of $RUNS"
            if ! GIKLI_E2E_OUTPUT="$GITHUB_WORKSPACE/smoke-output/run-$run" xvfb-run --auto-servernum npm run test:e2e; then
              failed+=("$run")
              echo "::error::Smoke test run $run of $RUNS failed"
            fi
            echo "::endgroup::"
          done
          if [ "$RUNS" -gt 1 ]; then
            message="${#failed[@]} of $RUNS smoke test runs failed${failed[*]:+ (numbers ${failed[*]})}."
            echo "$message"
            echo "**Smoke test on $JOB:** $message" >> "$GITHUB_STEP_SUMMARY"
          fi
          [ "${#failed[@]}" -eq 0 ]

      - name: Keep the smoke test's screenshots and WebDriver logs
        if: failure() && steps.smoke-linux.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-output-${{ matrix.name }}
          path: smoke-output
          if-no-files-found: warn
